<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Character Relationship Chart</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="web.css">
</head>
<body>
  <section class="web-bar" aria-label="設定ファイルの操作">
    <div class="web-heading"><strong>Character Relationship Chart</strong><span>Web版</span></div>
    <div class="web-actions">
      <button id="web-open" class="primary" type="button">設定を開く</button>
      <button id="web-direct-open" type="button" hidden>直接保存用に開く</button>
      <button id="web-sample" type="button">サンプル</button>
      <button id="web-save" type="button" hidden disabled>保存</button>
      <button id="web-download" type="button" disabled>設定をダウンロード</button>
      <input id="web-files" type="file" accept=".jsonc,.json" multiple hidden aria-label="設定と任意の表示データを選択">
    </div>
    <div class="web-actions web-view-actions" role="group" aria-label="表示データの操作">
      <button id="web-open-view" type="button" disabled>表示データを開く</button>
      <button id="web-direct-view-open" type="button" hidden disabled>表示データを直接保存用に開く</button>
      <button id="web-view-save" type="button" hidden disabled>表示データを保存</button>
      <button id="web-view-save-as" type="button" hidden disabled>表示データの新規保存先を選ぶ</button>
      <button id="web-view-download" type="button" disabled>表示データをダウンロード</button>
      <input id="web-view" type="file" accept=".view.json" hidden aria-label="対応する表示データを選択">
    </div>
    <div class="web-actions" role="group" aria-label="ページ内の編集履歴">
      <button id="web-undo" type="button" disabled title="Ctrl / Cmd + Z（文字入力中を除く）">取り消し</button>
      <button id="web-redo" type="button" disabled title="Ctrl / Cmd + Shift + Z、Ctrl + Y（文字入力中を除く）">やり直し</button>
      <span id="web-history-note" class="web-note" aria-live="polite"></span>
    </div>
    <p class="web-note">JSONC / JSONと、対応する .view.json を選択、または画面へドロップ。設定は「編集」→「反映」の後に保存・ダウンロードします。<br>配置・倍率・表示状態は表示データへ保存します。未反映のフォーム入力は保存しません。内容は外部へ送信しません。</p>
    <p id="web-save-note" class="web-note"></p>
    <p id="web-view-note" class="web-note"></p>
    <p id="web-view-status" class="web-note" aria-live="polite"></p>
    <p id="web-file" aria-live="polite">サンプルを読み込み中…</p>
    <p id="web-message" class="web-note" role="status"></p>
  </section>
  <!-- SHARED_UI -->
  <noscript>表示にはJavaScriptを有効にしてください。</noscript>
  <script src="app.js"></script>
</body>
</html>
